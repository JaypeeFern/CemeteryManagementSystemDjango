name: Build and deploy Docker image

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.html'
      - '**.css'
      - '**.js'
      - '**.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose*.yml'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

concurrency:
  group: cemetery-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_NAME: ghcr.io/jaypeefern/cemetery-management-system-django

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: cemetery-management-system-django:test
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Django checks and tests
        run: |
          docker run --rm \
            --entrypoint python \
            --env DJANGO_DEBUG=true \
            --env SQLITE_PATH=/tmp/test.sqlite3 \
            --env MEDIA_ROOT=/tmp/test-media \
            cemetery-management-system-django:test manage.py check
          docker run --rm \
            --entrypoint python \
            --env DJANGO_DEBUG=true \
            --env SQLITE_PATH=/tmp/test.sqlite3 \
            --env MEDIA_ROOT=/tmp/test-media \
            cemetery-management-system-django:test manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push_image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full lowercase 40-character Git SHA." >&2
            exit 1
          fi
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: push_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify digest-pinned image exists in GHCR
        env:
          IMAGE_REFERENCE: ghcr.io/jaypeefern/cemetery-management-system-django@${{ needs.build.outputs.image_digest }}
        run: docker buildx imagetools inspect "$IMAGE_REFERENCE"

  deploy:
    needs: [build, verify-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Pin Coolify to this image digest and commit, then trigger deployment
        env:
          URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Expected a verified OCI SHA-256 manifest digest." >&2
            exit 1
          fi

          if [ -z "$URL" ] && [ -z "$WEBHOOK_TOKEN" ] && [ -z "$API_TOKEN" ]; then
            echo "Coolify secrets are not configured; skipping automatic deployment."
            exit 0
          fi
          if [ -z "$URL" ] || [ -z "$WEBHOOK_TOKEN" ] || [ -z "$API_TOKEN" ]; then
            echo "Set COOLIFY_WEBHOOK_URL, COOLIFY_TOKEN, and COOLIFY_API_TOKEN together." >&2
            exit 1
          fi

          parsed=$(python3 - "$URL" <<'PY'
          from urllib.parse import parse_qs, urlparse
          import re
          import sys

          webhook = urlparse(sys.argv[1])
          if webhook.scheme != "https" or not webhook.hostname or webhook.username or webhook.password:
              raise SystemExit("COOLIFY_WEBHOOK_URL must be an HTTPS URL without embedded credentials")
          if webhook.path.rstrip("/") != "/api/v1/deploy":
              raise SystemExit("COOLIFY_WEBHOOK_URL must use the resource deploy endpoint")
          values = parse_qs(webhook.query).get("uuid", [])
          if len(values) != 1 or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]*", values[0]):
              raise SystemExit("COOLIFY_WEBHOOK_URL must contain one valid uuid query parameter")
          print(f"{webhook.scheme}://{webhook.netloc}")
          print(values[0])
          PY
          )
          mapfile -t values <<< "$parsed"
          if [ "${#values[@]}" -ne 2 ]; then
            echo "Could not derive the Coolify origin and application UUID." >&2
            exit 1
          fi

          api_root="${values[0]}/api/v1"
          application_uuid="${values[1]}"
          variables=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $API_TOKEN" \
            "$api_root/applications/$application_uuid/envs")
          if jq -e 'any(.[]; .key == "IMAGE_REFERENCE" and .is_preview == false)' <<< "$variables" >/dev/null; then
            env_method=PATCH
          else
            env_method=POST
          fi

          curl --fail-with-body --silent --show-error --output /dev/null --request "$env_method" \
            "$api_root/applications/$application_uuid/envs" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg image "$IMAGE_NAME@$IMAGE_DIGEST" '{key: "IMAGE_REFERENCE", value: $image, is_preview: false, is_literal: true, is_shown_once: false}')"

          variables=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $API_TOKEN" \
            "$api_root/applications/$application_uuid/envs")
          jq -e --arg image "$IMAGE_NAME@$IMAGE_DIGEST" \
            '([.[] | select(.key == "IMAGE_REFERENCE" and .is_preview == false)] as $refs | ($refs | length) == 1 and $refs[0].value == $image)' \
            <<< "$variables" >/dev/null

          curl --fail-with-body --silent --show-error --output /dev/null --request PATCH \
            "$api_root/applications/$application_uuid" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg sha "$IMAGE_TAG" '{git_commit_sha: $sha}')"

          state=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $API_TOKEN" \
            "$api_root/applications/$application_uuid")
          jq -e --arg sha "$IMAGE_TAG" '.git_commit_sha == $sha' <<< "$state" >/dev/null

          curl --fail-with-body --silent --show-error --output /dev/null --request POST \
            -H "Authorization: Bearer $WEBHOOK_TOKEN" "$URL"
